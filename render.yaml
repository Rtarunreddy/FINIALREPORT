databases:
  - name: report-ready-db
    plan: basic-256mb
    databaseName: report_ready

services:
  - type: web
    name: report-ready
    runtime: docker            # the Dockerfile installs LibreOffice for PDF export
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: report-ready-db
          property: connectionString
      - key: REPORT_READY_STORAGE
        value: s3
      - key: REPORT_READY_S3_BUCKET        # Cloudflare R2 / S3 bucket for uploaded and formatted files
        sync: false
      - key: REPORT_READY_S3_ENDPOINT      # e.g. https://<account>.r2.cloudflarestorage.com (leave empty for AWS S3)
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: REPORT_READY_COOKIE_SECURE
        value: "true"
      - key: REPORT_READY_PUBLIC_URL       # https://your-app.onrender.com, needed for Google sign-in
        sync: false
      - key: GOOGLE_CLIENT_ID              # optional
        sync: false
      - key: GOOGLE_CLIENT_SECRET          # optional
        sync: false
      - key: REPORT_READY_WORKERS          # in-process job workers; set 0 if you run `python -m app.worker` as a separate service
        value: "2"
      - key: REPORT_READY_SESSION_SECRET
        generateValue: true
